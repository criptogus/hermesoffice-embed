name: hermesoffice-embed
version: 0.1.0
description: Open and edit .docx, .xlsx, .pptx and .pdf documents inside a Hermes pane, using the HermesOffice editor engines served over a local HTTP bridge.
manifest_version: 2
requires_hermes: ">=0.21.0"
author: criptogus
license: MIT
homepage: https://github.com/criptogus/hermesoffice-embed
kind: standalone
platforms:
  - macos
tags:
  - desktop
  - office
  - documents
  - docx
  - xlsx
  - pptx
  - pdf
  - editor
capabilities: []
requires_env: []
python_dependencies: []
external_dependencies:
  - HermesOffice.app (installed at /Applications/HermesOffice.app)
